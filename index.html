<!DOCTYPE html>
<html>
<head>
<title>NFC Employee Clock</title>

<style>
body {
    font-family: Arial;
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
}

.container {
    max-width:500px;
    margin:auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

button {
    width:90%;
    padding:15px;
    margin:10px;
    font-size:18px;
    border-radius:10px;
}

.card {
    background:#333;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

<h1>NFC Employee Clock</h1>

<div class="card" id="employee">
Scan NFC card
</div>

<button onclick="clock('CLOCK IN')">
Clock In
</button>

<button onclick="clock('CLOCK OUT')">
Clock Out
</button>

<h2>Records</h2>

<div id="records"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import { 
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyCdbqYTc3-mlHuaBzZnwH-uiJgcUAEySTc",

authDomain: "nfc-clock-system.firebaseapp.com",

projectId: "nfc-clock-system",

storageBucket: "nfc-clock-system.firebasestorage.app",

messagingSenderId: "283731745865",

appId: "1:283731745865:web:60021fc03d73c123c83398"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let employees = [];
let currentEmployee = null;


fetch("employees.json")
.then(response => response.json())
.then(data => {

employees = data;

loadEmployee();

});


function loadEmployee(){

const params = new URLSearchParams(
window.location.search
);


const id = params.get("employee");


if(!id){
return;
}


currentEmployee = employees.find(
employee => employee.employeeId === id
);


if(currentEmployee){

document.getElementById("employee").innerHTML = `

Employee ID: ${currentEmployee.employeeId}<br>
Name: ${currentEmployee.name}<br>
Position: ${currentEmployee.position}

`;

}

}



window.clock = async function(action){


if(!currentEmployee){

alert("Scan NFC card first");

return;

}


await addDoc(collection(db,"clockRecords"),{

employeeId: currentEmployee.employeeId,

name: currentEmployee.name,

action: action,

time: new Date()

});


showRecords();

}



async function showRecords(){

const records = await getDocs(
query(
collection(db,"clockRecords"),
orderBy("time","desc")
)
);


document.getElementById("records").innerHTML = "";


records.forEach(record => {


let data = record.data();


document.getElementById("records").innerHTML += `

<hr>
${data.name}<br>
${data.action}<br>
${data.time.toDate()}

`;

});


}


showRecords();


</script>

</body>
</html>
